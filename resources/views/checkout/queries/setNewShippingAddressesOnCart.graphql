mutation setNewShippingAddressOnCart (
    $cart_id: String!,
    $prefix: String,
    $firstname: String!,
    $middlename: String,
    $lastname: String!,
    $suffix: String,
    $postcode: String,
    $street: [String]!,
    $city: String!,
    $country_code: String!,
    $region_id: Int,
    $telephone: String!,
    $fax: String,
    $company: String,
    $vat_id: String,
    $same_as_billing: Boolean = false,
) {
    setShippingAddressesOnCart(input: {
        cart_id: $cart_id,
        shipping_addresses: [
            {
                address: {
                    prefix: $prefix,
                    firstname: $firstname,
                    middlename: $middlename,
                    lastname: $lastname,
                    suffix: $suffix,
                    postcode: $postcode,
                    street: $street,
                    city: $city,
                    country_code: $country_code,
                    region_id: $region_id,
                    telephone: $telephone,
                    fax: $fax,
                    company: $company,
                    vat_id: $vat_id,
                    save_in_address_book: true,
                }
            }
        ]
    }) {
        cart { ...cart }
    }

    # Magento resets same_as_billing when the shipping address is saved, so copy it to the billing address again.
    # The same_as_billing variable comes from the current shipping address on the cart.
    setBillingAddressOnCart(input: {
        cart_id: $cart_id,
        billing_address: {
            same_as_shipping: true
        }
    }) @@include(if: $same_as_billing) {
        cart { ...cart }
    }
}

@include('rapidez::cart.queries.fragments.cart')
