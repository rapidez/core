mutation setExistingShippingAddressOnCart (
    $cart_id: String!,
    $customer_address_id: Int,
    $same_as_billing: Boolean = false
) {
    setShippingAddressesOnCart(input: {
        cart_id: $cart_id,
        shipping_addresses: [
            {
                customer_address_id: $customer_address_id,
            }
        ]
    }) {
        cart { ...cart }
    }

    # Magento resets same_as_billing when the shipping address is saved, so copy it to the billing address again.
    # The same_as_billing variable comes from the current shipping address on the cart.
    setBillingAddressOnCart(input: {
        cart_id: $cart_id,
        billing_address: {
            same_as_shipping: true
        }
    }) @@include(if: $same_as_billing) {
        cart { ...cart }
    }
}

@include('rapidez::cart.queries.fragments.cart')
