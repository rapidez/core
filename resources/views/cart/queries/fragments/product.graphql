fragment product on ProductInterface {
    @foreach(collect([
        'id',
        'sku',
        'name',
        'type_id',
        'url_key',
        'url_suffix',
        'special_price',
    ])->merge(config('rapidez.frontend.cart_attributes'))->unique() as $attribute)
        {{ $attribute }}
    @endforeach
    image {
        url
    }
    crosssell_products {
        id
    }
    @if (Rapidez::checkCompadreVersion('0.0.1'))
        stock_item {
            in_stock
            max_sale_qty
            min_sale_qty
            qty_increments
        }
    @endif
    ... on CustomizableProductInterface {
        options {
            uid
            title
            required
            sort_order
            @foreach(['CustomizableRadioOption', 'CustomizableCheckboxOption', 'CustomizableDropDownOption', 'CustomizableMultipleOption'] as $optionType)
                ... on {{ $optionType }} {
                    value {
                        uid
                        sku
                        title
                        price
                        price_type
                    }
                }
            @endforeach
        }
    }
}
